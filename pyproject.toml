[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meter"
version = "0.1.0"
description = "Strict local-only TUI monitor for Codex and Claude usage"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ai-meter"}]
dependencies = [
  "textual>=0.72.0",
  "rich>=13.7.0",
  "typer>=0.12.3",
  "pydantic>=2.8.2",
  "platformdirs>=4.2.2",
  "psutil>=6.0.0",
]

[project.scripts]
ai-meter = "ai_meter.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_meter = ["bin/win-x64/*"]
